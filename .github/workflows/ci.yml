name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python development tools
        run: python -m pip install -e ".[dev]"
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend bundle is committed
        run: git diff --exit-code -- taskstate_vault/ui/static
      - name: Public boundary
        run: python scripts/check_public_boundary.py
      - name: Lint
        run: ruff check taskstate_vault tests scripts
      - name: Tests
        run: python -B -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build
      - name: Clean wheel install smoke
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "tsv-wheel-smoke"
          $root = Join-Path $env:RUNNER_TEMP "tsv-workspace"
          python -m venv $venv
          $python = Join-Path $venv "Scripts/python.exe"
          $tsv = Join-Path $venv "Scripts/tsv.exe"
          $wheel = (Get-ChildItem "dist/*.whl" | Select-Object -First 1).FullName
          & $python -m pip install $wheel
          Push-Location $env:RUNNER_TEMP
          & $tsv --root $root init
          & $tsv --root $root status
          & $python -c "from importlib.resources import files; root=files('taskstate_vault.ui').joinpath('static'); assert root.joinpath('index.html').is_file(); assets=root.joinpath('assets'); assert any(p.name.endswith('.css') for p in assets.iterdir()); assert any(p.name.endswith('.js') for p in assets.iterdir())"
          Pop-Location
