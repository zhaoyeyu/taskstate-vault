name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public boundary
        run: python scripts/check_public_boundary.py
      - name: Tests
        run: python -B -m unittest discover -s tests -v
